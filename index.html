        <p>
            I hold a Master's degree in Marine Geosciences and Coastal Engineering from USTHB, built upon a solid academic foundation in Applied Geology.
        </p>
        <p>
            My work integrates field-based surveying operations with satellite remote sensing, geospatial analysis, and numerical hydrodynamics. I specialize in quantifying coastal processes, sediment dynamics, satellite-derived shallow-water bathymetry, and coastal infrastructure monitoring.
        </p>
        <p>

                <p>
                    Coupled physico-chemical and Sentinel-2 satellite remote sensing analysis to map water quality parameters and spatial pollution distributions across the Bay of Algiers.
                </p>
                <p><strong>Focus:</strong> Water Quality, Sentinel-2 Optical Indices, In Situ Calibration, Spatial Modeling.</p>
            </div>

        <div class="project">

                <h3>Tigzirt Coastal Assessment</h3>

                </p>
                <p><strong>Focus:</strong> Topographic Surveying, Shoreline Dynamics, Coastal Protection & Gabion Structures.</p>

                </p>
                <p><strong>Focus:</strong> Remote Sensing Bathymetry, Machine Learning, Coastal Hydrography.</p>
